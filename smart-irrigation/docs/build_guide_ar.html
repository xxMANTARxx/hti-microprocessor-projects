<textarea id="code-irr" hidden>/*
  SMART AI IRRIGATION  -  ESP32 only
  Runs on the ESP32 alone, next to the Smart Safe (the safe keeps the ATmega32 and the LCD).
  Checks the irrigation WATER (salinity with the TDS sensor), the plant cup water level,
  the air (DHT11) and the light (LDR). A trained decision tree (ai_model.h) decides:
     0 = WAIT, 1 = IRRIGATE (pump on), 2 = ALERT (water too salty, over 800 ppm -&gt; pump blocked)
  The phone is the screen: connect to WiFi &quot;SmartIrrigation&quot; (password 12345678),
  then open http://192.168.4.1

  Library (Tools &gt; Manage Libraries):
    - DHT sensor library  by Adafruit  (press &quot;Install all&quot; so it also installs Adafruit Unified Sensor)
  (The trained AI function aiDecide is inside this file.)
*/

#include &lt;WiFi.h&gt;
#include &lt;WebServer.h&gt;
#include &lt;DHT.h&gt;

// Trained decision tree (generated by train_model.py)
// returns 0 = WAIT, 1 = IRRIGATE, 2 = ALERT
int aiDecide(float tray_level, float tds, float temp, float humidity, float light) {
  if (tds &lt;= 800.27f) {
    if (tray_level &lt;= 53.68f) {
      if (light &lt;= 69.98f) {
        if (tray_level &lt;= 39.75f) {
          if (temp &lt;= 17.45f) {
            if (tray_level &lt;= 29.91f) {
              return 1;
            } else {
              return 0;
            }
          } else {
            if (tds &lt;= 733.43f) {
              return 1;
            } else {
              return 1;
            }
          }
        } else {
          if (temp &lt;= 30.00f) {
            if (humidity &lt;= 40.34f) {
              return 1;
            } else {
              return 0;
            }
          } else {
            if (temp &lt;= 38.89f) {
              return 1;
            } else {
              return 1;
            }
          }
        }
      } else {
        if (tray_level &lt;= 15.00f) {
          if (tds &lt;= 168.24f) {
            return 1;
          } else {
            return 1;
          }
        } else {
          if (tray_level &lt;= 21.60f) {
            if (light &lt;= 79.82f) {
              return 0;
            } else {
              return 0;
            }
          } else {
            return 0;
          }
        }
      }
    } else {
      if (tray_level &lt;= 54.97f) {
        if (light &lt;= 52.75f) {
          return 0;
        } else {
          return 0;
        }
      } else {
        if (temp &lt;= 36.58f) {
          if (tray_level &lt;= 55.44f) {
            return 0;
          } else {
            if (tray_level &lt;= 90.05f) {
              return 0;
            } else {
              return 0;
            }
          }
        } else {
          if (temp &lt;= 37.21f) {
            return 0;
          } else {
            if (humidity &lt;= 53.77f) {
              return 0;
            } else {
              return 0;
            }
          }
        }
      }
    }
  } else {
    if (tray_level &lt;= 60.50f) {
      if (tray_level &lt;= 12.44f) {
        if (humidity &lt;= 40.55f) {
          return 2;
        } else {
          return 2;
        }
      } else {
        return 2;
      }
    } else {
      if (tds &lt;= 1134.10f) {
        if (tds &lt;= 825.29f) {
          return 2;
        } else {
          if (humidity &lt;= 82.03f) {
            return 2;
          } else {
            if (tray_level &lt;= 77.75f) {
              return 2;
            } else {
              return 2;
            }
          }
        }
      } else {
        if (light &lt;= 44.28f) {
          return 2;
        } else {
          return 2;
        }
      }
    }
  }
}


// ---------- PINS ----------
const int PIN_TDS    = 35;   // TDS board A (analog)
const int PIN_LEVEL  = 34;   // HW-080 board AO (analog), probe in the plant cup
const int PIN_DHT    = 4;    // DHT11 DATA
const int PIN_LDR    = 32;   // LDR + 10k divider (analog). More light = higher number
const int PIN_RELAY  = 26;   // relay board IN1 -&gt; pump
const int PIN_BUZZER = 23;   // optional
const int PIN_LED_GREEN = 18; // optional: pump running (with a 220 ohm resistor)
const int PIN_LED_RED   = 19; // optional: alert (with a 220 ohm resistor)

// ---------- SETTINGS ----------
const bool RELAY_ACTIVE_HIGH = true;   // RM4V relay board turns ON with HIGH (tested). If the pump works the opposite way, set false
int LEVEL_DRY = 4095;    // raw value with the probe in air         (see &quot;raw&quot; on the phone page)
int LEVEL_WET = 1500;    // raw value with the probe deep in water   (see &quot;raw&quot; on the phone page)
const unsigned long PUMP_PULSE_MS = 3000;   // pump runs 3 s, then waits and measures again
const unsigned long SETTLE_MS     = 8000;   // wait for the water to settle
const char *AP_SSID = &quot;SmartIrrigation&quot;;
const char *AP_PASS = &quot;12345678&quot;;

DHT dht(PIN_DHT, DHT11);
WebServer server(80);

float tds = 0, level = 0, temp = 25, hum = 50, light = 50;
int   rawLevel = 0;
int   decision = 0;
bool  autoMode = true;
bool  pumpOn = false;
unsigned long pumpStarted = 0, lastPumpStop = 0, lastRead = 0;
const char *NAMES[] = {&quot;WAIT&quot;, &quot;IRRIGATE&quot;, &quot;ALERT&quot;};

// ---------- SENSORS ----------
int readMedianMv(int pin) {
  const int N = 21;
  int v[N];
  for (int i = 0; i &lt; N; i++) { v[i] = analogReadMilliVolts(pin); delay(5); }
  for (int i = 0; i &lt; N - 1; i++)
    for (int j = i + 1; j &lt; N; j++)
      if (v[j] &lt; v[i]) { int t = v[i]; v[i] = v[j]; v[j] = t; }
  return v[N / 2];
}

float readTds(float waterTemp) {
  float volt = readMedianMv(PIN_TDS) / 1000.0;
  float comp = 1.0 + 0.02 * (waterTemp - 25.0);       // temperature compensation
  float cv = volt / comp;
  float ppm = (133.42 * cv * cv * cv - 255.86 * cv * cv + 857.39 * cv) * 0.5;
  return ppm &lt; 0 ? 0 : ppm;
}

float readLevel() {
  rawLevel = analogRead(PIN_LEVEL);
  float pct = (float)(LEVEL_DRY - rawLevel) * 100.0 / (LEVEL_DRY - LEVEL_WET);
  return constrain(pct, 0, 100);
}

float readLight() {
  return constrain(analogRead(PIN_LDR) * 100.0 / 4095.0, 0, 100);   // 0 = dark, 100 = strong light
}

void readSensors() {
  float t = dht.readTemperature();
  float h = dht.readHumidity();
  if (!isnan(t)) temp = t;
  if (!isnan(h)) hum = h;
  tds = readTds(temp);           // water temp ~ air temp (no water thermometer)
  level = readLevel();
  light = readLight();
  decision = aiDecide(level, tds, temp, hum, light);
  // CSV line for training: tray_level,tds,temp,humidity,light,label
  Serial.printf(&quot;%.1f,%.0f,%.1f,%.0f,%.0f,%d   raw_level=%d\n&quot;, level, tds, temp, hum, light, decision, rawLevel);
}

// ---------- PUMP ----------
void setPump(bool on) {
  if (on == pumpOn) return;
  pumpOn = on;
  digitalWrite(PIN_RELAY, (on == RELAY_ACTIVE_HIGH) ? HIGH : LOW);
  digitalWrite(PIN_LED_GREEN, on ? HIGH : LOW);
  if (on) pumpStarted = millis(); else lastPumpStop = millis();
}

void autoControl() {
  unsigned long now = millis();
  if (decision == 2) { setPump(false); return; }                 // never pump salty water
  if (pumpOn &amp;&amp; now - pumpStarted &gt; PUMP_PULSE_MS) setPump(false);
  else if (!pumpOn &amp;&amp; decision == 1 &amp;&amp; now - lastPumpStop &gt; SETTLE_MS) setPump(true);
}

void sendJson() {
  char buf[200];
  snprintf(buf, sizeof(buf),
    &quot;{\&quot;tds\&quot;:%.0f,\&quot;level\&quot;:%.0f,\&quot;raw\&quot;:%d,\&quot;temp\&quot;:%.1f,\&quot;hum\&quot;:%.0f,\&quot;light\&quot;:%.0f,\&quot;dec\&quot;:\&quot;%s\&quot;,\&quot;pump\&quot;:%s,\&quot;auto\&quot;:%s}&quot;,
    tds, level, rawLevel, temp, hum, light, NAMES[decision], pumpOn ? &quot;true&quot; : &quot;false&quot;, autoMode ? &quot;true&quot; : &quot;false&quot;);
  server.send(200, &quot;application/json&quot;, buf);
}

void setupWeb() {
  WiFi.softAP(AP_SSID, AP_PASS);
  Serial.print(&quot;Open http://&quot;); Serial.println(WiFi.softAPIP());
  server.on(&quot;/&quot;, []() { server.send_P(200, &quot;text/html&quot;, PAGE); });
  server.on(&quot;/data&quot;, sendJson);
  server.on(&quot;/mode&quot;, []() { autoMode = !autoMode; setPump(false); sendJson(); });
  server.on(&quot;/pump&quot;, []() {
    if (!autoMode &amp;&amp; decision != 2) setPump(!pumpOn);   // salty water stays blocked
    sendJson();
  });
  server.begin();
}

// ---------- SETUP / LOOP ----------
void setup() {
  Serial.begin(115200);
  pinMode(PIN_RELAY, OUTPUT);
  digitalWrite(PIN_RELAY, RELAY_ACTIVE_HIGH ? LOW : HIGH);   // pump off at start
  pinMode(PIN_BUZZER, OUTPUT);
  pinMode(PIN_LED_GREEN, OUTPUT);
  pinMode(PIN_LED_RED, OUTPUT);
  analogSetAttenuation(ADC_11db);                            // read up to ~3.1 V
  dht.begin();
  setupWeb();
  Serial.println(&quot;tray_level,tds,temp,humidity,light,label&quot;);
}

void loop() {
  server.handleClient();
  unsigned long now = millis();

  if (now - lastRead &gt; 2000) {          // read every 2 s
    lastRead = now;
    int before = decision;
    readSensors();
    digitalWrite(PIN_LED_RED, decision == 2 ? HIGH : LOW);
    if (decision == 2 &amp;&amp; before != 2) {  // new alert: beep 3 times
      for (int i = 0; i &lt; 3; i++) { digitalWrite(PIN_BUZZER, HIGH); delay(150); digitalWrite(PIN_BUZZER, LOW); delay(100); }
    }
  }

  if (autoMode) autoControl();
  else if (pumpOn &amp;&amp; decision == 2) setPump(false);
}

  do:['<b>ري عادي:</b> كوباية الزرعة فاضية ← IRRIGATE والمضخة تملا ← WAIT.','<b>مية مالحة:</b> حط معلقة ملح في الخزان وقلّب ← الرقم يعدّي 800 ppm ← <b>ALERT</b>، والمضخة متشتغلش حتى لو الزرعة عطشانة.','<b>من الموبايل:</b> دوس Switch Auto/Manual، وشغّل المضخة بالزرار. ومع المية المالحة الزرار مش بيشغّلها.','<b>الجو:</b> حرارة أعلى من 30 أو رطوبة أقل من 40 ← الـ AI بيسقي بدري (عند 55% بدل 40%).','<b>الشمس (LDR):</b> خلّي مجس المستوى نصه في المية (المستوى حوالي 25%) ← IRRIGATE. نوّر على الـ LDR بكشاف الموبايل ← الـ AI يقول WAIT (الشمس جامدة، هيسقي بعدين). شيل الكشاف ← يرجع IRRIGATE.','بعد التجربة: غيّر مية الخزان بمية عادية.'],
  check:'الـ 5 سيناريوهات اشتغلوا. مشروع الري خلص! اللي بعده: جيت هاب.',
  fix:['الملح مش بيوصل ALERT: زوّد ملح وقلّب كويس، واستنى 10 ثواني.','الدكتور سأل عن الـ AI: "Decision tree trained on 6,000 samples, 97.9% test accuracy. Inputs: water level, salinity, temperature, humidity, and light (LDR). Output: wait, irrigate, or alert. It runs on the ESP32 with no internet."']},
];

const COLORS = {blue:'--w-blue',yellow:'--w-yellow',orange:'--w-orange',purple:'--w-purple',green:'--w-green',cyan:'--w-cyan',pink:'--w-pink',brown:'--w-brown'};
let done = {};
try { done = JSON.parse(localStorage.getItem('irr-ar-done') || '{}'); } catch (e) { done = {}; }
let cur = 0;
try { const s = parseInt(localStorage.getItem('irr-ar-step'), 10); if (s >= 0 && s < STEPS.length) cur = s; } catch (e) {}

const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) {
    e.textContent = text;
    if (tag === 'text' && /[؀-ۿ]/.test(String(text))) {
      const a = attrs['text-anchor'] || 'start';
      e.setAttribute('direction', 'rtl');
      e.setAttribute('text-anchor', a === 'start' ? 'end' : a === 'end' ? 'start' : 'middle');
    }
  }
  if (parent) parent.appendChild(e);
  return e;
}

function drawCircuit(stepNo) {
  const W = 780, PITCH = 24, TOP = 50;
  const CX1 = 300, CX2 = 480;
  const H = TOP + NP * PITCH + 40;
  const svg = el('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'رسمة التوصيل للخطوة دي'});
  const py = i => TOP + 20 + ((i <= NP ? i : i - NP) - 1) * PITCH;
  const visible = PARTS.filter(p => stepNo >= p.from);
  const used = new Set();
  visible.forEach(p => p.ports.forEach(q => used.add(q.pin)));
  const tags = TAGS.filter(t => stepNo >= t.from);
  tags.forEach(t => used.add(t.pin));

  el('rect', {x: CX1, y: TOP - 30, width: CX2 - CX1, height: NP * PITCH + 34, rx: 8, class: 'board'}, svg);
  el('rect', {x: (CX1+CX2)/2 - 40, y: TOP - 22, width: 80, height: 18, rx: 2, class: 'ant'}, svg);
  el('rect', {x: (CX1+CX2)/2 - 34, y: TOP + 40, width: 68, height: 80, rx: 4, class: 'board-chip'}, svg);
  el('text', {x: (CX1+CX2)/2, y: TOP + 85, 'text-anchor': 'middle', class: 'pinlbl', 'font-size': 12}, svg, 'ESP32');
  el('rect', {x: (CX1+CX2)/2 - 16, y: TOP + NP * PITCH - 6, width: 32, height: 12, rx: 3, class: 'board-chip'}, svg);
  el('text', {x: (CX1+CX2)/2, y: TOP + NP * PITCH - 14, 'text-anchor': 'middle', class: 'pinnum'}, svg, 'USB');
  for (let i = 1; i <= 2 * NP; i++) {
    const left = i <= NP, y = py(i), u = used.has(i);
    el('line', {x1: left ? CX1 - 14 : CX2, x2: left ? CX1 : CX2 + 14, y1: y, y2: y, class: 'stub' + (u ? ' used' : '')}, svg);
    el('text', {x: left ? CX1 + 10 : CX2 - 10, y: y + 4, 'text-anchor': left ? 'start' : 'end', class: 'pinlbl' + (u ? ' used' : '')}, svg, PIN[i]);
  }
  tags.forEach(t => {
    const left = t.pin <= NP, y = py(t.pin);
    const w = t.t.length * 7 + 14;
    const x = left ? CX1 - 20 - w : CX2 + 20;
    el('rect', {x, y: y - 9, width: w, height: 17, rx: 8, class: 'tagbg-' + t.k}, svg);
    el('text', {x: x + w / 2, y: y + 4, 'text-anchor': 'middle', class: 'tag tag-' + t.k}, svg, t.t);
  });
  ['L', 'R'].forEach(side => {
    const list = visible.filter(p => p.side === side).map(p => {
      const ports = p.ports.slice().sort((a, b) => py(a.pin) - py(b.pin));
      const h = 38 + ports.length * 20;
      const centre = ports.reduce((s, q) => s + py(q.pin), 0) / ports.length;
      return {p, ports, h, top: centre - h / 2};
    }).sort((a, b) => a.top - b.top);
    let bottom = 0;
    list.forEach(b => { if (b.top < bottom + 8) b.top = bottom + 8; if (b.top < 4) b.top = 4; bottom = b.top + b.h; });
    const BW = 180, BX = side === 'L' ? 10 : W - 10 - BW;
    let lane = 0;
    list.forEach(b => {
      const st = b.p.from === stepNo ? 'new' : 'old';
      el('rect', {x: BX, y: b.top, width: BW, height: b.h, rx: 9, class: 'box ' + st}, svg);
      el('text', {x: BX + 10, y: b.top + 17, class: 'boxname ' + st}, svg, b.p.name);
      el('text', {x: BX + 10, y: b.top + 31, class: 'boxsub ' + st}, svg, b.p.sub);
      b.ports.forEach((q, i) => {
        const yy = b.top + 38 + i * 20 + 8;
        const edge = side === 'L' ? BX + BW : BX;
        el('text', {x: side === 'L' ? edge - 10 : edge + 10, y: yy + 4, 'text-anchor': side === 'L' ? 'end' : 'start', class: 'portlbl ' + st}, svg, q.l);
        const pinX = side === 'L' ? CX1 - 14 : CX2 + 14, y2 = py(q.pin);
        let d;
        if (Math.abs(yy - y2) < 1) d = `M${edge} ${yy} H${pinX}`;
        else {
          const lx = side === 'L' ? edge + 22 + (lane % 5) * 9 : edge - 22 - (lane % 5) * 9;
          lane++;
          d = `M${edge} ${yy} H${lx} V${y2} H${pinX}`;
        }
        el('path', {d, class: 'wire ' + st, style: `stroke:var(${COLORS[q.c]})`}, svg);
        el('circle', {cx: edge, cy: yy, r: 3.5, style: `fill:var(${COLORS[q.c]})`}, svg);
      });
    });
  });
  return svg;
}

function drawSetup() {
  const svg = el('svg', {viewBox: '0 0 780 300', role: 'img', 'aria-label': 'شكل نموذج الري: خزان ومضخة وكوباية زرعة وموبايل'});
  // tank
  el('text', {x: 110, y: 52, 'text-anchor': 'middle', class: 'title-svg'}, svg, 'كوباية الخزان');
  el('path', {d: 'M50 60 L60 270 L160 270 L170 60', class: 'sv-line'}, svg);
  el('path', {d: 'M54 120 L60 270 L160 270 L166 120 Z', class: 'water'}, svg);
  el('rect', {x: 70, y: 235, width: 36, height: 30, rx: 5, class: 'sv-cop'}, svg);
  el('text', {x: 88, y: 288, 'text-anchor': 'middle', class: 'sv-small'}, svg, 'مضخة');
  el('rect', {x: 132, y: 140, width: 10, height: 110, rx: 4, class: 'sv-acc'}, svg);
  el('text', {x: 137, y: 288, 'text-anchor': 'middle', class: 'sv-small'}, svg, 'مجس TDS');
  // tube
  el('path', {d: 'M88 235 C 88 20, 330 20, 330 110', class: 'sv-blue'}, svg);
  el('text', {x: 210, y: 46, 'text-anchor': 'middle', class: 'sv-small'}, svg, 'خرطوم');
  // plant cup
  el('text', {x: 340, y: 290, 'text-anchor': 'middle', class: 'title-svg'}, svg, 'كوباية الزرعة');
  el('path', {d: 'M280 120 L290 270 L390 270 L400 120', class: 'sv-line'}, svg);
  el('path', {d: 'M289 230 L290 270 L390 270 L392 230 Z', class: 'water'}, svg);
  el('path', {d: 'M340 120 C 330 90, 310 90, 300 100 M340 120 C 350 85, 375 85, 385 98 M340 120 L340 150', class: 'sv-line', style: 'stroke:var(--w-green)'}, svg);
  el('rect', {x: 372, y: 170, width: 6, height: 90, class: 'sv-cop'}, svg);
  el('rect', {x: 382, y: 170, width: 6, height: 90, class: 'sv-cop'}, svg);
  el('text', {x: 400, y: 215, class: 'sv-small'}, svg, 'مجس المستوى');
  // DHT
  el('rect', {x: 420, y: 100, width: 26, height: 34, rx: 4, style: 'fill:var(--w-blue)'}, svg);
  el('text', {x: 455, y: 122, class: 'sv-small'}, svg, 'DHT11');
  el('circle', {cx: 433, cy: 80, r: 9, style: 'fill:var(--w-yellow)'}, svg);
  el('text', {x: 455, y: 84, class: 'sv-small'}, svg, 'LDR');
  // ESP32 + breadboard
  el('rect', {x: 540, y: 150, width: 200, height: 110, rx: 6, class: 'sv-fill'}, svg);
  el('text', {x: 640, y: 195, 'text-anchor': 'middle', class: 'sv-txt'}, svg, 'البريد بورد + ESP32');
  el('text', {x: 640, y: 215, 'text-anchor': 'middle', class: 'sv-small'}, svg, '(بعيد عن المية)');
  el('text', {x: 640, y: 235, 'text-anchor': 'middle', class: 'sv-small'}, svg, 'والخزنة جنبه');
  // phone
  el('rect', {x: 640, y: 30, width: 54, height: 96, rx: 9, class: 'sv-line'}, svg);
  el('rect', {x: 647, y: 44, width: 40, height: 22, rx: 3, class: 'sv-acc'}, svg);
  el('text', {x: 667, y: 59, 'text-anchor': 'middle', class: 'sv-small', style: 'fill:var(--surface)'}, svg, 'AI');
  el('text', {x: 610, y: 82, 'text-anchor': 'middle', class: 'sv-small'}, svg, 'الموبايل');
  el('path', {d: 'M610 150 Q 600 120 630 110', class: 'sv-line', 'stroke-dasharray': '4 4'}, svg);
  el('text', {x: 560, y: 132, 'text-anchor': 'middle', class: 'sv-small'}, svg, 'واي فاي');
  return svg;
}

function render() {
  const s = STEPS[cur], n = cur + 1;
  const rail = document.getElementById('rail');
  rail.innerHTML = '';
  let phase = '';
  STEPS.forEach((st, i) => {
    if (st.phase !== phase) { phase = st.phase; const p = document.createElement('div'); p.className = 'phase'; p.textContent = phase; rail.appendChild(p); }
    const b = document.createElement('button');
    b.type = 'button';
    if (i === cur) b.setAttribute('aria-current', 'step');
    if (done[i]) b.classList.add('done');
    b.innerHTML = `<span class="dot">${done[i] ? '✓' : i + 1}</span><span class="nm">${st.name}</span>`;
    b.title = st.name;
    b.onclick = () => go(i);
    rail.appendChild(b);
  });
  const count = Object.values(done).filter(Boolean).length;
  document.getElementById('progress').innerHTML = `خلصت <b>${count}</b> من ${STEPS.length} خطوة`;

  const main = document.getElementById('main');
  main.innerHTML = '';
  const card = document.createElement('section');
  card.className = 'card';
  card.innerHTML = `<div class="eyebrow">${s.eyebrow}</div><h2>${s.name}</h2><p class="lead">${s.lead}</p>`;
  if (s.parts) {
    const ul = document.createElement('ul'); ul.className = 'parts'; ul.style.marginTop = '14px';
    s.parts.forEach(([a, b]) => { const li = document.createElement('li'); li.innerHTML = `<b>${a}</b>${b}`; ul.appendChild(li); });
    card.appendChild(ul);
  }
  const dia = document.createElement('div');
  dia.className = 'diagram';
  dia.appendChild(s.setup ? drawSetup() : drawCircuit(n));
  card.appendChild(dia);
  if (!s.setup) {
    const lg = document.createElement('div'); lg.className = 'legend';
    lg.innerHTML = `<span><i style="background:var(--copper)"></i>المربع البرتقاني = جديد في الخطوة دي</span><span><i style="background:var(--w-pos)"></i>أحمر = 5 فولت (+)</span><span><i style="background:var(--w-neg)"></i>أزرق = سالب (−)</span><span>صف 3V3 = العمود الصغير اللي عملناه في خطوة 2</span><span>صف الضوء = عمود الـ LDR (خطوة 8)</span><span>الرسمة على شكل بوردتكم (38 رجل، الـ USB تحت). V5 = VIN</span>`;
    card.appendChild(lg);
  }
  main.appendChild(card);

  const card2 = document.createElement('section');
  card2.className = 'card';
  const cols = document.createElement('div'); cols.className = 'cols';
  const left = document.createElement('div');
  left.innerHTML = `<h3>اعمل كده</h3><ol class="do">${s.do.map(x => `<li>${x}</li>`).join('')}</ol>`;
  if (s.code) {
    const box = document.createElement('div'); box.className = 'hex';
    const label = 'كود Arduino: مشروع الري (ESP32)';
    const src = document.getElementById('code-irr').value.trim();
    box.innerHTML = `<b>${label}</b><button class="btn primary" type="button">انسخ الكود</button><textarea readonly aria-label="${label}"></textarea>`;
    box.querySelector('textarea').value = src;
    box.querySelector('button').onclick = (e) => {
      const ta = box.querySelector('textarea');
      const ok = () => { e.target.textContent = 'اتنسخ'; setTimeout(() => e.target.textContent = 'انسخ الكود', 1500); };
      try { navigator.clipboard.writeText(src).then(ok, () => { ta.focus(); ta.select(); e.target.textContent = 'دوس Ctrl+C'; }); }
      catch (err) { ta.focus(); ta.select(); e.target.textContent = 'دوس Ctrl+C'; }
    };
    left.appendChild(box);
  }
  const right = document.createElement('div');
  right.innerHTML = `<div class="check"><h3>كده تمام لما…</h3><p>${s.check}</p></div>
    <details class="fix"><summary>مش شغال؟</summary><ul>${s.fix.map(x => `<li>${x}</li>`).join('')}</ul></details>`;
  cols.append(left, right);
  card2.appendChild(cols);
  main.appendChild(card2);

  const foot = document.createElement('div');
  foot.className = 'card foot';
  foot.innerHTML = `<button class="btn ghost" type="button" id="back" ${cur === 0 ? 'disabled' : ''}>→ اللي قبلها</button>
    <label><input type="checkbox" id="donebox" ${done[cur] ? 'checked' : ''}> الخطوة دي اشتغلت</label>
    <button class="btn primary" type="button" id="next" ${cur === STEPS.length - 1 ? 'disabled' : ''}>الخطوة اللي بعدها ←</button>`;
  main.appendChild(foot);
  foot.querySelector('#back').onclick = () => go(cur - 1);
  foot.querySelector('#next').onclick = () => { done[cur] = true; save(); go(cur + 1); };
  foot.querySelector('#donebox').onchange = (e) => { done[cur] = e.target.checked; save(); render(); };
}
function save() { try { localStorage.setItem('irr-ar-done', JSON.stringify(done)); localStorage.setItem('irr-ar-step', String(cur)); } catch (e) {} }
function go(i) { if (i < 0 || i >= STEPS.length) return; cur = i; save(); render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
render();
</script>
