<textarea id="hex-blink" hidden>/*
  ESP32 -&gt; ATmega32A FLASHER : Blink test
  Everything is inside this one file. Just open it in Arduino IDE and Upload.
  Board: &quot;ESP32 Dev Module&quot;. Then open Serial Monitor at 115200.

  Wiring (ATmega32 powered from ESP32 3V3 while flashing):
    ESP32 G23 -&gt; ATmega pin 6  (MOSI)
    ESP32 G19 -&gt; ATmega pin 7  (MISO)
    ESP32 G18 -&gt; ATmega pin 8  (SCK)
    ESP32 G5  -&gt; ATmega pin 9  (RESET, 10k pull-up to + stays)
    ESP32 G4  -&gt; ATmega pin 13 (XTAL1, clock from the ESP32, helps chips set for a crystal)
    ESP32 3V3 -&gt; + line,  ESP32 GND -&gt; - line
  Press the EN (reset) button on the ESP32 to flash again.
*/
#include &lt;Arduino.h&gt;

const int P_MOSI = 23, P_MISO = 19, P_SCK = 18, P_RST = 5, P_CLK = 4;

void startClock() {                         // 1 MHz square wave on G4 -&gt; ATmega XTAL1 (pin 13)
#if defined(ESP_ARDUINO_VERSION_MAJOR) &amp;&amp; ESP_ARDUINO_VERSION_MAJOR &gt;= 3
  ledcAttach(P_CLK, 1000000, 1);
  ledcWrite(P_CLK, 1);
#else
  ledcSetup(0, 1000000, 1);
  ledcAttachPin(P_CLK, 0);
  ledcWrite(0, 1);
#endif
}
const uint16_t PAGE_WORDS = 64;            // ATmega32: 64 words = 128 bytes per page

const uint32_t FW_SIZE = 142;
const uint8_t FW[] PROGMEM = {
  0x0C, 0x94, 0x2A, 0x00, 0x0C, 0x94, 0x34, 0x00, 0x0C, 0x94, 0x34, 0x00, 0x0C, 0x94, 0x34, 0x00,
  0x0C, 0x94, 0x34, 0x00, 0x0C, 0x94, 0x34, 0x00, 0x0C, 0x94, 0x34, 0x00, 0x0C, 0x94, 0x34, 0x00,
  0x0C, 0x94, 0x34, 0x00, 0x0C, 0x94, 0x34, 0x00, 0x0C, 0x94, 0x34, 0x00, 0x0C, 0x94, 0x34, 0x00,
  0x0C, 0x94, 0x34, 0x00, 0x0C, 0x94, 0x34, 0x00, 0x0C, 0x94, 0x34, 0x00, 0x0C, 0x94, 0x34, 0x00,
  0x0C, 0x94, 0x34, 0x00, 0x0C, 0x94, 0x34, 0x00, 0x0C, 0x94, 0x34, 0x00, 0x0C, 0x94, 0x34, 0x00,
  0x0C, 0x94, 0x34, 0x00, 0x11, 0x24, 0x1F, 0xBE, 0xCF, 0xE5, 0xD8, 0xE0, 0xDE, 0xBF, 0xCD, 0xBF,
  0x0E, 0x94, 0x36, 0x00, 0x0C, 0x94, 0x45, 0x00, 0x0C, 0x94, 0x00, 0x00, 0xB8, 0x9A, 0x91, 0xE0,
  0x88, 0xB3, 0x89, 0x27, 0x88, 0xBB, 0x2F, 0xE3, 0x3D, 0xE0, 0x83, 0xE0, 0x21, 0x50, 0x30, 0x40,
  0x80, 0x40, 0xE1, 0xF7, 0x00, 0xC0, 0x00, 0x00, 0xF3, 0xCF, 0xF8, 0x94, 0xFF, 0xCF,
};

uint8_t xfer(uint8_t out) {                 // bit-banged SPI, mode 0, ~60 kHz (safe for a 1 MHz chip)
  uint8_t in = 0;
  for (int i = 7; i &gt;= 0; i--) {
    digitalWrite(P_MOSI, (out &gt;&gt; i) &amp; 1);
    delayMicroseconds(8);
    digitalWrite(P_SCK, HIGH);
    delayMicroseconds(8);
    in = (in &lt;&lt; 1) | digitalRead(P_MISO);
    digitalWrite(P_SCK, LOW);
  }
  return in;
}
uint8_t cmd(uint8_t a, uint8_t b, uint8_t c, uint8_t d) { xfer(a); xfer(b); xfer(c); return xfer(d); }

bool enterProgramming() {
  for (int tries = 0; tries &lt; 5; tries++) {
    digitalWrite(P_SCK, LOW);
    digitalWrite(P_RST, HIGH); delay(5);
    digitalWrite(P_RST, LOW);  delay(30);
    xfer(0xAC); xfer(0x53); uint8_t echo = xfer(0x00); xfer(0x00);
    if (echo == 0x53) return true;
    Serial.printf(&quot;  try %d: no answer (got 0x%02X)\n&quot;, tries + 1, echo);
  }
  return false;
}

void finish(bool ok) {
  digitalWrite(P_RST, HIGH);
  pinMode(P_MOSI, INPUT); pinMode(P_SCK, INPUT); pinMode(P_RST, INPUT);   // let the ATmega run
  Serial.println(ok ? &quot;\n==== DONE: verify 100% OK ====&quot; : &quot;\n==== FAILED ====&quot;);
  Serial.println(ok ? &quot;Now follow the next step in the guide.&quot; : &quot;Check: 3V3 and GND wires, pins 10/30 to +, 11/31 to -, G23-&gt;6, G19-&gt;7, G18-&gt;8, G5-&gt;9, G4-&gt;13. Then press EN.&quot;);
}

void setup() {
  Serial.begin(115200);
  delay(1500);
  Serial.println(&quot;\nESP32 -&gt; ATmega32A flasher: Blink test&quot;);
  pinMode(P_MOSI, OUTPUT); pinMode(P_SCK, OUTPUT); pinMode(P_RST, OUTPUT); pinMode(P_MISO, INPUT);
  startClock();
  delay(50);
  Serial.printf(&quot;MISO line idle level: %d\n&quot;, digitalRead(P_MISO));

  if (!enterProgramming()) { Serial.println(&quot;The ATmega32 does not answer.&quot;); finish(false); return; }
  uint8_t s0 = cmd(0x30, 0, 0, 0), s1 = cmd(0x30, 0, 1, 0), s2 = cmd(0x30, 0, 2, 0);
  Serial.printf(&quot;Signature: %02X %02X %02X %s\n&quot;, s0, s1, s2, (s0 == 0x1E &amp;&amp; s1 == 0x95 &amp;&amp; s2 == 0x02) ? &quot;(ATmega32 OK)&quot; : &quot;(UNEXPECTED)&quot;);
  uint8_t lf = cmd(0x50, 0, 0, 0), hf = cmd(0x58, 0x08, 0, 0);
  Serial.printf(&quot;Fuses: low=%02X high=%02X  (factory = E1 99, internal 1 MHz)\n&quot;, lf, hf);
  if (s0 != 0x1E || s1 != 0x95) { finish(false); return; }

  Serial.println(&quot;Erasing...&quot;);
  cmd(0xAC, 0x80, 0, 0); delay(20);
  enterProgramming();

  uint32_t words = (FW_SIZE + 1) / 2;
  Serial.printf(&quot;Writing %u bytes...\n&quot;, (unsigned)FW_SIZE);
  for (uint32_t page = 0; page * PAGE_WORDS &lt; words; page++) {
    for (uint16_t i = 0; i &lt; PAGE_WORDS; i++) {
      uint32_t w = page * PAGE_WORDS + i;
      uint8_t lo = (2 * w &lt; FW_SIZE) ? pgm_read_byte(&amp;FW[2 * w]) : 0xFF;
      uint8_t hi = (2 * w + 1 &lt; FW_SIZE) ? pgm_read_byte(&amp;FW[2 * w + 1]) : 0xFF;
      cmd(0x40, 0, i, lo);
      cmd(0x48, 0, i, hi);
    }
    uint16_t a = page * PAGE_WORDS;
    cmd(0x4C, a &gt;&gt; 8, a &amp; 0xFF, 0);
    delay(10);
    Serial.print(&#x27;#&#x27;);
  }
  Serial.println(&quot;\nVerifying...&quot;);
  uint32_t bad = 0;
  for (uint32_t w = 0; w &lt; words; w++) {
    uint8_t lo = cmd(0x20, w &gt;&gt; 8, w &amp; 0xFF, 0), hi = cmd(0x28, w &gt;&gt; 8, w &amp; 0xFF, 0);
    if (lo != pgm_read_byte(&amp;FW[2 * w])) bad++;
    if (2 * w + 1 &lt; FW_SIZE &amp;&amp; hi != pgm_read_byte(&amp;FW[2 * w + 1])) bad++;
  }
  Serial.printf(&quot;Verify: %u bytes wrong\n&quot;, (unsigned)bad);
  finish(bad == 0);
}

void loop() {}

uint8_t xfer(uint8_t out) {                 // bit-banged SPI, mode 0, ~60 kHz (safe for a 1 MHz chip)
  uint8_t in = 0;
  for (int i = 7; i &gt;= 0; i--) {
    digitalWrite(P_MOSI, (out &gt;&gt; i) &amp; 1);
    delayMicroseconds(8);
    digitalWrite(P_SCK, HIGH);
    delayMicroseconds(8);
    in = (in &lt;&lt; 1) | digitalRead(P_MISO);
    digitalWrite(P_SCK, LOW);
  }
  return in;
}
uint8_t cmd(uint8_t a, uint8_t b, uint8_t c, uint8_t d) { xfer(a); xfer(b); xfer(c); return xfer(d); }

bool enterProgramming() {
  for (int tries = 0; tries &lt; 5; tries++) {
    digitalWrite(P_SCK, LOW);
    digitalWrite(P_RST, HIGH); delay(5);
    digitalWrite(P_RST, LOW);  delay(30);
    xfer(0xAC); xfer(0x53); uint8_t echo = xfer(0x00); xfer(0x00);
    if (echo == 0x53) return true;
    Serial.printf(&quot;  try %d: no answer (got 0x%02X)\n&quot;, tries + 1, echo);
  }
  return false;
}

void finish(bool ok) {
  digitalWrite(P_RST, HIGH);
  pinMode(P_MOSI, INPUT); pinMode(P_SCK, INPUT); pinMode(P_RST, INPUT);   // let the ATmega run
  Serial.println(ok ? &quot;\n==== DONE: verify 100% OK ====&quot; : &quot;\n==== FAILED ====&quot;);
  Serial.println(ok ? &quot;Now follow the next step in the guide.&quot; : &quot;Check: 3V3 and GND wires, pins 10/30 to +, 11/31 to -, G23-&gt;6, G19-&gt;7, G18-&gt;8, G5-&gt;9, G4-&gt;13. Then press EN.&quot;);
}

void setup() {
  Serial.begin(115200);
  delay(1500);
  Serial.println(&quot;\nESP32 -&gt; ATmega32A flasher: Smart Safe&quot;);
  pinMode(P_MOSI, OUTPUT); pinMode(P_SCK, OUTPUT); pinMode(P_RST, OUTPUT); pinMode(P_MISO, INPUT);
  startClock();
  delay(50);
  Serial.printf(&quot;MISO line idle level: %d\n&quot;, digitalRead(P_MISO));

  if (!enterProgramming()) { Serial.println(&quot;The ATmega32 does not answer.&quot;); finish(false); return; }
  uint8_t s0 = cmd(0x30, 0, 0, 0), s1 = cmd(0x30, 0, 1, 0), s2 = cmd(0x30, 0, 2, 0);
  Serial.printf(&quot;Signature: %02X %02X %02X %s\n&quot;, s0, s1, s2, (s0 == 0x1E &amp;&amp; s1 == 0x95 &amp;&amp; s2 == 0x02) ? &quot;(ATmega32 OK)&quot; : &quot;(UNEXPECTED)&quot;);
  uint8_t lf = cmd(0x50, 0, 0, 0), hf = cmd(0x58, 0x08, 0, 0);
  Serial.printf(&quot;Fuses: low=%02X high=%02X  (factory = E1 99, internal 1 MHz)\n&quot;, lf, hf);
  if (s0 != 0x1E || s1 != 0x95) { finish(false); return; }

  Serial.println(&quot;Erasing...&quot;);
  cmd(0xAC, 0x80, 0, 0); delay(20);
  enterProgramming();

  uint32_t words = (FW_SIZE + 1) / 2;
  Serial.printf(&quot;Writing %u bytes...\n&quot;, (unsigned)FW_SIZE);
  for (uint32_t page = 0; page * PAGE_WORDS &lt; words; page++) {
    for (uint16_t i = 0; i &lt; PAGE_WORDS; i++) {
      uint32_t w = page * PAGE_WORDS + i;
      uint8_t lo = (2 * w &lt; FW_SIZE) ? pgm_read_byte(&amp;FW[2 * w]) : 0xFF;
      uint8_t hi = (2 * w + 1 &lt; FW_SIZE) ? pgm_read_byte(&amp;FW[2 * w + 1]) : 0xFF;
      cmd(0x40, 0, i, lo);
      cmd(0x48, 0, i, hi);
    }
    uint16_t a = page * PAGE_WORDS;
    cmd(0x4C, a &gt;&gt; 8, a &amp; 0xFF, 0);
    delay(10);
    Serial.print(&#x27;#&#x27;);
  }
  Serial.println(&quot;\nVerifying...&quot;);
  uint32_t bad = 0;
  for (uint32_t w = 0; w &lt; words; w++) {
    uint8_t lo = cmd(0x20, w &gt;&gt; 8, w &amp; 0xFF, 0), hi = cmd(0x28, w &gt;&gt; 8, w &amp; 0xFF, 0);
    if (lo != pgm_read_byte(&amp;FW[2 * w])) bad++;
    if (2 * w + 1 &lt; FW_SIZE &amp;&amp; hi != pgm_read_byte(&amp;FW[2 * w + 1])) bad++;
  }
  Serial.printf(&quot;Verify: %u bytes wrong\n&quot;, (unsigned)bad);
  finish(bad == 0);
}

const COLORS = {blue:'--w-blue',yellow:'--w-yellow',orange:'--w-orange',purple:'--w-purple',green:'--w-green',cyan:'--w-cyan',pink:'--w-pink',brown:'--w-brown'};

const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) {
    e.textContent = text;
    if (tag === 'text' && /[\u0600-\u06FF]/.test(String(text))) {   // Arabic: right-to-left, keep the same visual anchor
      const a = attrs['text-anchor'] || 'start';
      e.setAttribute('direction', 'rtl');
      e.setAttribute('text-anchor', a === 'start' ? 'end' : a === 'end' ? 'start' : 'middle');
    }
  }
  if (parent) parent.appendChild(e);
  return e;
}

function drawCircuit(stepNo) {
  const W = 780, PITCH = 24, TOP = 40;
  const CX1 = 290, CX2 = 490;
  const H = TOP + 20 * PITCH + 40;
  const svg = el('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'رسمة التوصيل للخطوة دي'});
  const py = i => i <= 20 ? TOP + 14 + (i - 1) * PITCH : TOP + 14 + (40 - i) * PITCH;

  const visible = PARTS.filter(p => stepNo >= p.from && (p.to == null || stepNo <= p.to));
  const used = new Set();
  visible.forEach(p => p.ports.forEach(q => used.add(q.pin)));
  const tags = TAGS.filter(t => stepNo >= t.from);
  tags.forEach(t => used.add(t.pin));

  // chip
  el('rect', {x: CX1, y: TOP, width: CX2 - CX1, height: 20 * PITCH + 4, rx: 6, class: 'chip'}, svg);
  el('path', {d: `M${(CX1+CX2)/2-14} ${TOP} a14 14 0 0 0 28 0 z`, class: 'chip-notch'}, svg);
  el('text', {x: (CX1+CX2)/2, y: TOP + 20 * PITCH - 30, 'text-anchor': 'middle', class: 'pinlbl', 'font-size': 13}, svg, 'ATmega32A');
  el('circle', {cx: CX1 + 12, cy: TOP + 12, r: 3.5, class: 'chip-notch'}, svg);
  for (let i = 1; i <= 40; i++) {
    const left = i <= 20, y = py(i), u = used.has(i);
    el('line', {x1: left ? CX1 - 14 : CX2, x2: left ? CX1 : CX2 + 14, y1: y, y2: y, class: 'stub' + (u ? ' used' : '')}, svg);
    el('text', {x: left ? CX1 - 18 : CX2 + 18, y: y - 6, 'text-anchor': left ? 'end' : 'start', class: 'pinnum'}, svg, i);
    el('text', {x: left ? CX1 + 22 : CX2 - 22, y: y + 4, 'text-anchor': left ? 'start' : 'end', class: 'pinlbl' + (u ? ' used' : '')}, svg, PIN[i]);
  }
  // power tags inside the chip
  tags.forEach(t => {
    const left = t.pin <= 20, y = py(t.pin);
    const w = t.t.length * 7 + 10;
    const x = left ? CX1 + 64 : CX2 - 64 - w;
    el('rect', {x, y: y - 9, width: w, height: 16, rx: 8, class: 'tagbg-' + t.k}, svg);
    el('text', {x: x + w / 2, y: y + 3, 'text-anchor': 'middle', class: 'tag tag-' + t.k}, svg, t.t);
  });

  // part boxes, stacked so they never overlap
  ['L', 'R'].forEach(side => {
    const list = visible.filter(p => p.side === side).map(p => {
      const ports = p.ports.slice().sort((a, b) => py(a.pin) - py(b.pin));
      const h = 38 + ports.length * 20;
      const centre = ports.reduce((s, q) => s + py(q.pin), 0) / ports.length;
      return {p, ports, h, top: centre - h / 2};
    }).sort((a, b) => a.top - b.top);
    let bottom = 0;
    list.forEach(b => { if (b.top < bottom + 8) b.top = bottom + 8; if (b.top < 4) b.top = 4; bottom = b.top + b.h; });
    const BX = side === 'L' ? 14 : W - 14 - 170, BW = 170;
    let lane = 0;
    list.forEach(b => {
      const isNew = b.p.from === stepNo;
      const st = isNew ? 'new' : 'old';
      el('rect', {x: BX, y: b.top, width: BW, height: b.h, rx: 9, class: 'box ' + st}, svg);
      el('text', {x: BX + 10, y: b.top + 17, class: 'boxname ' + st}, svg, b.p.name);
      el('text', {x: BX + 10, y: b.top + 31, class: 'boxsub ' + st}, svg, b.p.sub);
      b.ports.forEach((q, i) => {
        const yy = b.top + 38 + i * 20 + 8;
        const edge = side === 'L' ? BX + BW : BX;
        el('text', {x: side === 'L' ? edge - 10 : edge + 10, y: yy + 4, 'text-anchor': side === 'L' ? 'end' : 'start', class: 'portlbl ' + st}, svg, q.l);
        const pinX = side === 'L' ? CX1 - 14 : CX2 + 14, y2 = py(q.pin);
        let d;
        if (Math.abs(yy - y2) < 1) d = `M${edge} ${yy} H${pinX}`;
        else {
          const lx = side === 'L' ? edge + 18 + (lane % 6) * 9 : edge - 18 - (lane % 6) * 9;
          lane++;
          d = `M${edge} ${yy} H${lx} V${y2} H${pinX}`;
        }
        el('path', {d, class: 'wire ' + st, style: `stroke:var(${COLORS[q.c]})`}, svg);
        el('circle', {cx: edge, cy: yy, r: 3.5, style: `fill:var(${COLORS[q.c]})`, class: st === 'old' ? 'wire old' : ''}, svg);
      });
    });
  });
  return svg;
}

function drawBreadboard() {
  const svg = el('svg', {viewBox: '0 0 780 360', role: 'img', 'aria-label': 'رسمة البريد بورد'});
  el('rect', {x: 20, y: 20, width: 740, height: 320, rx: 10, class: 'sv-fill'}, svg);
  const cols = 30, X0 = 70, DX = 22;
  // rails
  const rail = (y, k, label) => {
    el('line', {x1: X0 - 10, x2: X0 + (cols - 1) * DX + 10, y1: y - 9, y2: y - 9, style: `stroke:var(--w-${k});stroke-width:2.5`}, svg);
    for (let c = 0; c < cols; c++) el('circle', {cx: X0 + c * DX, cy: y, r: 3.2, style: `fill:var(--w-${k})`}, svg);
    el('text', {x: 40, y: y + 4, 'text-anchor': 'middle', class: 'tag tag-' + (k === 'pos' ? 'pos' : 'neg'), 'font-size': 16}, svg, k === 'pos' ? '+' : '−');
    el('text', {x: X0 + cols * DX + 4, y: y + 4, class: 'sv-small'}, svg, label);
  };
  rail(48, 'pos', 'أحمر +');
  rail(72, 'neg', 'أزرق −');
  // holes
  const ROWY = r => r < 5 ? 108 + r * 18 : 108 + 5 * 18 + 22 + (r - 5) * 18;
  for (let c = 0; c < cols; c++) for (let r = 0; r < 10; r++)
    el('circle', {cx: X0 + c * DX, cy: ROWY(r), r: 2.8, class: 'chip-notch', style: 'fill:var(--chip-dim)'}, svg);
  // gap
  el('rect', {x: X0 - 10, y: ROWY(4) + 9, width: (cols - 1) * DX + 20, height: 6, rx: 3, style: 'fill:var(--line)'}, svg);
  el('text', {x: X0 + cols * DX + 4, y: ROWY(4) + 16, class: 'sv-small'}, svg, 'الفاصل');
  // highlighted column
  const hc = 3;
  el('rect', {x: X0 + hc * DX - 8, y: ROWY(0) - 8, width: 16, height: ROWY(4) - ROWY(0) + 16, rx: 8, style: 'fill:none;stroke:var(--w-green);stroke-width:2.5'}, svg);
  el('text', {x: X0 + hc * DX, y: ROWY(9) + 34, 'text-anchor': 'middle', class: 'sv-txt', style: 'fill:var(--w-green)'}, svg, 'الـ5 دول متوصلين ببعض');

  // chip over the gap
  const cx0 = X0 + 12 * DX - 6, cw = 8 * DX + 12;
  el('rect', {x: cx0, y: ROWY(4) - 4, width: cw, height: ROWY(5) - ROWY(4) + 8, rx: 4, class: 'chip'}, svg);
  el('text', {x: cx0 + cw / 2, y: (ROWY(4) + ROWY(5)) / 2 + 4, 'text-anchor': 'middle', class: 'pinlbl used'}, svg, 'الشريحة');
  // a wire from a pin column to the red rail
  const wc = 13;
  el('path', {d: `M${X0 + wc * DX} ${ROWY(1)} C ${X0 + wc * DX} 80, ${X0 + 20 * DX} 70, ${X0 + 22 * DX} 48`, class: 'wire', style: 'stroke:var(--w-pos)'}, svg);
  el('circle', {cx: X0 + wc * DX, cy: ROWY(1), r: 5, style: 'fill:var(--w-pos)'}, svg);
  el('circle', {cx: X0 + 22 * DX, cy: 48, r: 5, style: 'fill:var(--w-pos)'}, svg);
  el('text', {x: X0 + 23 * DX + 6, y: 100, class: 'sv-txt'}, svg, 'سلك من عمود الرجل للخط الأحمر');
  return svg;
}

function render() {
  const s = STEPS[cur], n = cur + 1;
  // rail
  const rail = document.getElementById('rail');
  rail.innerHTML = '';
  let phase = '';
  STEPS.forEach((st, i) => {
    if (st.phase !== phase) { phase = st.phase; const p = document.createElement('div'); p.className = 'phase'; p.textContent = phase; rail.appendChild(p); }
    const b = document.createElement('button');
    b.type = 'button';
    if (i === cur) b.setAttribute('aria-current', 'step');
    if (done[i]) b.classList.add('done');
    b.innerHTML = `<span class="dot">${done[i] ? '✓' : i + 1}</span><span class="nm">${st.name}</span>`;
    b.title = st.name;
    b.onclick = () => go(i);
    rail.appendChild(b);
  });
  const count = Object.values(done).filter(Boolean).length;
  document.getElementById('progress').innerHTML = `خلصت <b>${count}</b> من ${STEPS.length} خطوة`;

  const main = document.getElementById('main');
  main.innerHTML = '';
  const card = document.createElement('section');
  card.className = 'card';
  card.innerHTML = `<div class="eyebrow">${s.eyebrow}</div><h2>${s.name}</h2><p class="lead">${s.lead}</p>`;
  const dia = document.createElement('div');
  dia.className = 'diagram';
  if (s.parts) {
    const ul = document.createElement('ul'); ul.className = 'parts'; ul.style.marginTop = '14px';
    s.parts.forEach(([a, b]) => { const li = document.createElement('li'); li.innerHTML = `<b>${a}</b>${b}`; ul.appendChild(li); });
    card.appendChild(ul);
  }
  dia.appendChild(s.box ? drawBox() : s.bb ? drawBreadboard() : drawCircuit(n));
  card.appendChild(dia);
  if (!s.box && !s.bb) {
    const lg = document.createElement('div'); lg.className = 'legend';
    lg.innerHTML = `<span><i style="background:var(--copper)"></i>المربع البرتقاني = جديد في الخطوة دي</span><span><i style="background:var(--w-pos)"></i>+ = الخط الأحمر</span><span><i style="background:var(--w-neg)"></i>− = الخط الأزرق</span><span>الخطوط اللي بتتحرك = السلوك اللي هتركبها دلوقتي</span>`;
    card.appendChild(lg);
  }
  main.appendChild(card);

  const card2 = document.createElement('section');
  card2.className = 'card';
  const cols = document.createElement('div'); cols.className = 'cols';
  const left = document.createElement('div');
  left.innerHTML = `<h3>اعمل كده</h3><ol class="do">${s.do.map(x => `<li>${x}</li>`).join('')}</ol>`;
  if (s.hex) {
    const box = document.createElement('div'); box.className = 'hex';
    const label = s.hex === 'blink' ? 'كود Arduino: تجربة اللمبة' : 'كود Arduino: برنامج الخزنة';
    const src = document.getElementById(s.hex === 'blink' ? 'hex-blink' : 'hex-safe').value.trim();
    box.innerHTML = `<b>${label}</b><button class="btn primary" type="button" id="copy-${s.hex}">انسخ الكود</button><textarea id="ta-${s.hex}" readonly aria-label="${label}"></textarea>`;
    box.querySelector('textarea').value = src;
    box.querySelector('button').onclick = (e) => {
      const ta = box.querySelector('textarea');
      const ok = () => { e.target.textContent = 'اتنسخ'; setTimeout(() => e.target.textContent = 'انسخ الكود', 1500); };
      try { navigator.clipboard.writeText(src).then(ok, () => { ta.focus(); ta.select(); e.target.textContent = 'دوس Ctrl+C'; }); }
      catch (err) { ta.focus(); ta.select(); e.target.textContent = 'دوس Ctrl+C'; }
    };
    left.appendChild(box);
  }
  const right = document.createElement('div');
  right.innerHTML = `<div class="check"><h3>كده تمام لما…</h3><p>${s.check}</p></div>
    <details class="fix"><summary>مش شغال؟</summary><ul>${s.fix.map(x => `<li>${x}</li>`).join('')}</ul></details>`;
  cols.append(left, right);
  card2.appendChild(cols);
  main.appendChild(card2);

  const foot = document.createElement('div');
  foot.className = 'card foot';
  foot.innerHTML = `<button class="btn ghost" type="button" id="back" ${cur === 0 ? 'disabled' : ''}>→ اللي قبلها</button>
    <label><input type="checkbox" id="donebox" ${done[cur] ? 'checked' : ''}> الخطوة دي اشتغلت</label>
    <button class="btn primary" type="button" id="next" ${cur === STEPS.length - 1 ? 'disabled' : ''}>الخطوة اللي بعدها ←</button>`;
  main.appendChild(foot);
  foot.querySelector('#back').onclick = () => go(cur - 1);
  foot.querySelector('#next').onclick = () => { done[cur] = true; save(); go(cur + 1); };
  foot.querySelector('#donebox').onchange = (e) => { done[cur] = e.target.checked; save(); render(); };
}
function save() { try { localStorage.setItem('safe-ar-done', JSON.stringify(done)); localStorage.setItem('safe-ar-step', String(cur)); } catch (e) {} }
function go(i) { if (i < 0 || i >= STEPS.length) return; cur = i; save(); render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
render();
</script>
